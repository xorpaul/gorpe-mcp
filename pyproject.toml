[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gorpe-mcp"
version = "0.2.0"
description = "MCP server for gorpe remote command execution"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.6.0,<2.0",
    "uvicorn>=0.30.0",
    "PyYAML>=6.0",
]

[project.scripts]
gorpe-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
